<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Inventory Management System</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .metric-card .title {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .metric-card .value {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .controls-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .search-filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      flex: 1;
    }

    input, select, button {
      padding: 8px 12px;
      font-size: 0.875rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    input[type="text"] {
      min-width: 240px;
      flex: 1;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: var(--text);
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .pagination-controls {
      display: flex;
      gap: 8px;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    .form-group input, .form-group select {
      width: 100%;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:hover {
      background-color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Asset Inventory Management System</h1>
    </header>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="title">Total Items</div>
        <div class="value" id="metricTotalItems">0</div>
      </div>
      <div class="metric-card">
        <div class="title">Capitalized Asset Value</div>
        <div class="value" id="metricCapValue">₱0.00</div>
      </div>
      <div class="metric-card">
        <div class="title">Semi-Expendable Value</div>
        <div class="value" id="metricSemiValue">₱0.00</div>
      </div>
    </div>

    <div class="controls-card">
      <div class="search-filter-group">
        <input type="text" id="searchInput" placeholder="Search description, property #, accountable..." oninput="filterTable()">
        
        <select id="filterCategory" onchange="filterTable()">
          <option value="">All Categories</option>
          <option value="Capitalized">Capitalized (≥ ₱50,000)</option>
          <option value="Semi-Expendable">Semi-Expendable (&lt; ₱50,000)</option>
        </select>

        <select id="filterOffice" onchange="filterTable()">
          <option value="">All Offices</option>
        </select>

        <select id="filterSheets" onchange="filterTable()">
          <option value="">All Funds</option>
        </select>
      </div>

      <button onclick="openAddModal()">+ Add Asset</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Property No.</th>
            <th>Asset Description</th>
            <th>Office</th>
            <th>Accountable</th>
            <th>Fund</th>
            <th>Cost (PHP)</th>
            <th>Category</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody">
          <tr>
            <td colspan="7" style="text-align: center;">Loading asset records...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <span id="pageInfo">Showing 0 of 0 entries</span>
      <div class="pagination-controls">
        <button id="btnPrev" onclick="changePage(-1)">Previous</button>
        <button id="btnNext" onclick="changePage(1)">Next</button>
      </div>
    </div>
  </div>

  <!-- Add Asset Modal -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h2>Add New Asset</h2>
      <form id="addAssetForm" onsubmit="handleAddAsset(event)">
        <div class="form-group">
          <label for="add-prop">Property No.</label>
          <input type="text" id="add-prop" required>
        </div>
        <div class="form-group">
          <label for="add-desc">Asset Description</label>
          <input type="text" id="add-desc" required>
        </div>
        <div class="form-group">
          <label for="add-office">Office</label>
          <select id="add-office" required></select>
        </div>
        <div class="form-group">
          <label for="add-accountable">Accountable Person</label>
          <input type="text" id="add-accountable">
        </div>
        <div class="form-group">
          <label for="add-cost">Cost (PHP)</label>
          <input type="number" step="0.01" id="add-cost" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeAddModal()">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let rawAssetData = [];
    let filteredAssetData = [];
    let currentPage = 1;
    const rowsPerPage = 15;

    // Helper functions
    function parseCurrency(val) {
      if (!val) return 0;
      if (typeof val === 'number') return val;
      const clean = String(val).replace(/[^0-9.-]+/g, '');
      return parseFloat(clean) || 0;
    }

    function isCapitalized(cost, categoryStr) {
      if (categoryStr && categoryStr.toLowerCase().includes('capitalized')) return true;
      if (categoryStr && categoryStr.toLowerCase().includes('semi')) return false;
      return cost >= 50000;
    }

    function formatPHP(amount) {
      return new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' }).format(amount);
    }

    // Safely retrieve object value ignoring key casing/extra spaces
    function getPropValue(obj, targetKey) {
      if (!obj) return '';
      const key = Object.keys(obj).find(k => k.trim().toLowerCase() === targetKey.trim().toLowerCase());
      return key ? obj[key] : '';
    }

    // Populate Filters Dynamically
    function populateDynamicDropdowns(data) {
      const officeFilterSelect = document.getElementById('filterOffice');
      const addOfficeSelect = document.getElementById('add-office');
      const fundSelect = document.getElementById('filterSheets');

      // Safely extract offices handling uppercase/lowercase keys and extra spaces
      const rawOffices = data
        .map(item => String(getPropValue(item, 'Office')).trim())
        .filter(Boolean);

      const offices = [...new Set(rawOffices)].sort();

      const rawFunds = data
        .map(item => String(getPropValue(item, 'Fund')).trim())
        .filter(Boolean);

      const funds = [...new Set(rawFunds)].sort();

      officeFilterSelect.innerHTML = `<option value="">All Offices</option>`;
      offices.forEach(office => {
        const opt = document.createElement('option');
        opt.value = office;
        opt.textContent = office;
        officeFilterSelect.appendChild(opt);
      });

      addOfficeSelect.innerHTML = '';
      if (offices.length > 0) {
        offices.forEach(office => {
          const opt = document.createElement('option');
          opt.value = office;
          opt.textContent = office;
          addOfficeSelect.appendChild(opt);
        });
      } else {
        addOfficeSelect.innerHTML = `<option value="MDRRMO">MDRRMO</option>`;
      }

      fundSelect.innerHTML = `<option value="">All Funds</option>`;
      funds.forEach(fund => {
        const opt = document.createElement('option');
        opt.value = fund;
        opt.textContent = fund;
        fundSelect.appendChild(opt);
      });
    }

    // Filter Logic
    function filterTable() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const catFilter = document.getElementById('filterCategory').value;
      const fundFilter = document.getElementById('filterSheets').value.trim();
      const officeFilter = document.getElementById('filterOffice').value.trim();

      filteredAssetData = rawAssetData.filter(item => {
        const desc = String(getPropValue(item, 'Asset Description') || getPropValue(item, 'Description')).toLowerCase();
        const prop = String(getPropValue(item, 'Property No.') || getPropValue(item, 'Property Number')).toLowerCase();
        const serial = String(getPropValue(item, 'Serial No.')).toLowerCase();
        const accountable = String(getPropValue(item, 'Accountable')).toLowerCase();
        const office = String(getPropValue(item, 'Office')).trim();
        const fund = String(getPropValue(item, 'Fund')).trim();

        const cost = parseCurrency(getPropValue(item, 'Cost (PHP)') || getPropValue(item, 'Cost'));
        const capitalized = isCapitalized(cost, getPropValue(item, 'Category'));

        // Broad query matching across standard keys
        const matchesQuery = !q ||
          desc.includes(q) ||
          prop.includes(q) ||
          serial.includes(q) ||
          accountable.includes(q) ||
          office.toLowerCase().includes(q);

        let matchesCat = true;
        if (catFilter === 'Capitalized') matchesCat = capitalized;
        else if (catFilter === 'Semi-Expendable') matchesCat = !capitalized;

        const matchesFund = !fundFilter || fund === fundFilter;
        const matchesOffice = !officeFilter || office === officeFilter;

        return matchesQuery && matchesCat && matchesFund && matchesOffice;
      });

      currentPage = 1;
      renderTable();
      calculateMetrics(filteredAssetData);
    }

    // Table Rendering & Pagination
    function renderTable() {
      const tbody = document.getElementById('inventoryTableBody');
      tbody.innerHTML = '';

      if (filteredAssetData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center;">No assets match your search/filter criteria.</td></tr>`;
        document.getElementById('pageInfo').textContent = 'Showing 0 of 0 entries';
        document.getElementById('btnPrev').disabled = true;
        document.getElementById('btnNext').disabled = true;
        return;
      }

      const start = (currentPage - 1) * rowsPerPage;
      const end = start + rowsPerPage;
      const pageData = filteredAssetData.slice(start, end);

      pageData.forEach(item => {
        const propNo = getPropValue(item, 'Property No.') || getPropValue(item, 'Property Number') || '-';
        const desc = getPropValue(item, 'Asset Description') || getPropValue(item, 'Description') || '-';
        const office = getPropValue(item, 'Office') || '-';
        const accountable = getPropValue(item, 'Accountable') || '-';
        const fund = getPropValue(item, 'Fund') || '-';
        const cost = parseCurrency(getPropValue(item, 'Cost (PHP)') || getPropValue(item, 'Cost'));
        const capitalized = isCapitalized(cost, getPropValue(item, 'Category'));

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${propNo}</td>
          <td>${desc}</td>
          <td>${office}</td>
          <td>${accountable}</td>
          <td>${fund}</td>
          <td>${formatPHP(cost)}</td>
          <td>${capitalized ? 'Capitalized' : 'Semi-Expendable'}</td>
        `;
        tbody.appendChild(tr);
      });

      const totalPages = Math.ceil(filteredAssetData.length / rowsPerPage);
      document.getElementById('pageInfo').textContent = `Showing ${start + 1} to ${Math.min(end, filteredAssetData.length)} of ${filteredAssetData.length} entries`;
      document.getElementById('btnPrev').disabled = currentPage === 1;
      document.getElementById('btnNext').disabled = currentPage >= totalPages;
    }

    function changePage(direction) {
      currentPage += direction;
      renderTable();
    }

    // Metrics Calculation
    function calculateMetrics(data) {
      let capValue = 0;
      let semiValue = 0;

      data.forEach(item => {
        const cost = parseCurrency(getPropValue(item, 'Cost (PHP)') || getPropValue(item, 'Cost'));
        if (isCapitalized(cost, getPropValue(item, 'Category'))) {
          capValue += cost;
        } else {
          semiValue += cost;
        }
      });

      document.getElementById('metricTotalItems').textContent = data.length.toLocaleString();
      document.getElementById('metricCapValue').textContent = formatPHP(capValue);
      document.getElementById('metricSemiValue').textContent = formatPHP(semiValue);
    }

    // Modal Control
    function openAddModal() {
      document.getElementById('addModal').classList.add('active');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('active');
      document.getElementById('addAssetForm').reset();
    }

    function handleAddAsset(e) {
      e.preventDefault();
      const newAsset = {
        "Property No.": document.getElementById('add-prop').value,
        "Asset Description": document.getElementById('add-desc').value,
        "Office": document.getElementById('add-office').value,
        "Accountable": document.getElementById('add-accountable').value,
        "Fund": "General Fund",
        "Cost (PHP)": parseFloat(document.getElementById('add-cost').value) || 0
      };

      rawAssetData.unshift(newAsset);
      populateDynamicDropdowns(rawAssetData);
      filterTable();
      closeAddModal();
    }

    // Mock initial data load (replace with google.script.run or fetch API)
    function loadInitialData() {
      // Sample dataset including MDRRMO to verify functionality
      rawAssetData = [
        { "Property No.": "2023-001", "Asset Description": "Laptop Computer", "Office": "MDRRMO", "Accountable": "Juan Dela Cruz", "Fund": "GF", "Cost (PHP)": 65000 },
        { "Property No.": "2023-002", "Asset Description": "Rescue Helmet", "Office": "MDRRMO", "Accountable": "Maria Santos", "Fund": "LDRRMF", "Cost (PHP)": 4500 },
        { "Property No.": "2023-003", "Asset Description": "Office Desk", "Office": "MHO", "Accountable": "Pedro Penduko", "Fund": "GF", "Cost (PHP)": 12000 },
        { "Property No.": "2023-004", "Asset Description": "Ambulance Vehicle", "Office": "MHO", "Accountable": "Dr. Smith", "Fund": "GF", "Cost (PHP)": 1200000 },
        { "Property No.": "2023-005", "Asset Description": "Chainsaw Kit", "Office": "MDRRMO", "Accountable": "Juan Dela Cruz", "Fund": "LDRRMF", "Cost (PHP)": 48000 }
      ];

      populateDynamicDropdowns(rawAssetData);
      filterTable();
    }

    window.addEventListener('DOMContentLoaded', loadInitialData);
  </script>
</body>
</html>
