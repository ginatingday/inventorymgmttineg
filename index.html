<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Inventory System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-lg">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-emerald-400">Asset Inventory Management</h1>
                <p class="text-sm text-slate-400 mt-1">Track, monitor, and manage municipal and organizational physical assets.</p>
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search assets..." 
                    oninput="handleSearch()"
                    class="bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 w-full md:w-64"
                />
            </div>
        </div>

        <!-- Table Container -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl shadow-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-950/60 border-b border-slate-800 text-slate-400 uppercase text-[11px] tracking-wider">
                            <th class="p-4 font-semibold">Property Tag</th>
                            <th class="p-4 font-semibold">Asset Description</th>
                            <th class="p-4 font-semibold">Department</th>
                            <th class="p-4 font-semibold">Status</th>
                            <th class="p-4 font-semibold text-center">Photo</th>
                        </tr>
                    </thead>
                    <tbody id="assetTableBody" class="divide-y divide-slate-800/60">
                        <!-- Dynamic Rows Will Be Injected Here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script Section -->
    <script>
        // Sample Initial Data Set
        let assetData = [
            { id: "LGU-TNG-001", description: "Starlink Standard Kit", department: "ICT Office", status: "Active", Photos: "" },
            { id: "LGU-TNG-002", description: "HP LaserJet Pro Printer", department: "Mayor's Office", status: "Active", Photos: "https://images.unsplash.com/photo-1612815154858-60aa4c59eaa6?w=100&auto=format&fit=crop&q=60" },
            { id: "LGU-TNG-003", description: "Executive Ergonomic Chair", department: "Budget Office", status: "For Repair", Photos: "" },
            { id: "LGU-TNG-004", description: "Dell Latitude 5420 Laptop", department: "Accounting", status: "Active", Photos: "" }
        ];

        let filteredAssetData = [...assetData];

        function renderTable() {
            const tbody = document.getElementById('assetTableBody');
            tbody.innerHTML = '';

            if (filteredAssetData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-500">No matching assets found.</td></tr>`;
                return;
            }

            filteredAssetData.forEach((item, globalIdx) => {
                const photoUrl = item["Photos"];
                const photoCell = photoUrl 
                    ? `<a href="${photoUrl}" target="_blank"><img src="${photoUrl}" class="w-7 h-7 object-cover rounded border border-slate-700 mx-auto" /></a>`
                    : `<button onclick="openPhotoModal(${globalIdx})" class="bg-slate-900 hover:bg-slate-800 text-emerald-400 border border-slate-800 px-2 py-1 rounded text-[10px] font-medium mx-auto block transition-colors">📷 + Photo</button>`;

                const statusColor = item.status === 'Active' ? 'text-emerald-400 bg-emerald-950/40 border-emerald-900/50' : 'text-amber-400 bg-amber-950/40 border-amber-900/50';

                const row = document.createElement('tr');
                row.className = "hover:bg-slate-800/40 transition-colors";
                row.innerHTML = `
                    <td class="p-4 font-mono text-xs text-slate-300">${item.id}</td>
                    <td class="p-4 font-medium text-slate-200">${item.description}</td>
                    <td class="p-4 text-slate-400">${item.department}</td>
                    <td class="p-4"><span class="px-2.5 py-0.5 rounded-full text-[11px] border font-medium ${statusColor}">${item.status}</span></td>
                    <td class="p-4 text-center">${photoCell}</td>
                `;
                tbody.appendChild(row);
            });
        }

        let selectedPhotoIdx = null;

        function openPhotoModal(index) {
            selectedPhotoIdx = index;
            const item = filteredAssetData[index];
            const currentPhoto = item["Photos"] || '';
            
            const newUrl = prompt("Enter Image URL or Link for this asset:", currentPhoto);
            if (newUrl !== null) {
                filteredAssetData[selectedPhotoIdx]["Photos"] = newUrl.trim();
                renderTable();
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            filteredAssetData = assetData.filter(item => 
                item.id.toLowerCase().includes(query) ||
                item.description.toLowerCase().includes(query) ||
                item.department.toLowerCase().includes(query) ||
                item.status.toLowerCase().includes(query)
            );
            renderTable();
        }

        // Initial render on load
        window.onload = renderTable;
    </script>
</body>
</html>
