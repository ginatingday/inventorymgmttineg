<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LGU Tineg - Local Asset Inventory System</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .header-title {
      color: #0d6efd;
      font-weight: 700;
    }
    .card {
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .table-img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
    }
    /* COA PAR & Sticker Modal Print Styles */
    @media print {
      body * {
        visibility: hidden;
      }
      #printContainer, #printContainer * {
        visibility: visible;
      }
      #printContainer {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
    .sticker-box {
      border: 2px solid #000;
      padding: 10px;
      width: 300px;
      font-size: 12px;
      background: #fff;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand font-weight-bold" href="#"><i class="fa-solid fa-boxes-stacked me-2"></i>LGU Tineg - Asset Inventory</a>
    </div>
  </nav>

  <div class="container-fluid px-4">
    <div class="row">
      
      <!-- Asset Entry Form Column -->
      <div class="col-lg-4 mb-4">
        <div class="card p-4">
          <h5 class="card-title mb-3 text-primary"><i class="fa-solid fa-plus-circle me-2"></i>Register New Asset</h5>
          <form id="assetForm">
            
            <div class="mb-3">
              <label for="assetName" class="form-label font-weight-bold">Asset / Item Description</label>
              <input type="text" class="form-control" id="assetName" placeholder="e.g. Laptop, Vehicle, Desk" required>
            </div>

            <div class="mb-3">
              <label for="acquisitionCost" class="form-label font-weight-bold">Acquisition Cost (₱)</label>
              <input type="number" step="0.01" class="form-control" id="acquisitionCost" placeholder="0.00" required>
              <small class="text-muted">COA Rule: ≥ ₱50,000 = Capitalized Asset | < ₱50,000 = Semi-Expendable</small>
            </div>

            <div class="mb-3">
              <label for="propertyNo" class="form-label font-weight-bold">Property Number</label>
              <input type="text" class="form-control" id="propertyNo" placeholder="e.g. 2026-09-001">
            </div>

            <div class="mb-3">
              <label for="accountableOfficer" class="form-label font-weight-bold">Accountable Officer</label>
              <input type="text" class="form-control" id="accountableOfficer" placeholder="Full Name">
            </div>

            <!-- PHOTO UPLOAD INPUT -->
            <div class="mb-3">
              <label for="assetPhoto" class="form-label font-weight-bold"><i class="fa-solid fa-camera me-1"></i>Upload Asset Photo</label>
              <input type="file" class="form-control" id="assetPhoto" accept="image/png, image/jpeg, image/jpg">
              <small class="form-text text-muted">Uploaded photos are saved to Drive and linked in Google Sheets.</small>
            </div>

            <button type="button" id="submitBtn" onclick="submitForm()" class="btn btn-primary w-100">
              <i class="fa-solid fa-paper-plane me-1"></i> Submit Asset
            </button>
          </form>
        </div>
      </div>

      <!-- Asset Inventory Table Column -->
      <div class="col-lg-8">
        <div class="card p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title text-primary"><i class="fa-solid fa-table me-2"></i>Property & Asset Registry</h5>
            <button onclick="fetchData()" class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-rotate me-1"></i>Refresh Data</button>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle" id="inventoryTable">
              <thead class="table-light">
                <tr>
                  <th>Date</th>
                  <th>Description</th>
                  <th>Cost</th>
                  <th>Classification</th>
                  <th>Photo</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <tr>
                  <td colspan="6" class="text-center text-muted py-4">Click "Refresh Data" to load assets...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Print Modal Container -->
  <div id="printContainer" class="d-none"></div>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // Configured Google Apps Script Web App Endpoint URL
    const API_URL = "https://script.google.com/macros/s/AKfycby1G8wFhXfw3vYorNMJJhkSOF3hffXZz0lnjQG5eGsp4RaHXZVsUXXYNLP0f7M0w3Dc8w/exec";

    // Helper: Convert File Object to Base64 String
    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // Submit Form Handler with Base64 File Payload
    async function submitForm() {
      const submitBtn = document.getElementById('submitBtn');
      const name = document.getElementById('assetName').value;
      const cost = parseFloat(document.getElementById('acquisitionCost').value) || 0;
      const propNo = document.getElementById('propertyNo').value;
      const officer = document.getElementById('accountableOfficer').value;
      const fileInput = document.getElementById('assetPhoto');

      if (!name || isNaN(cost)) {
        alert("Please fill in required fields (Description and Acquisition Cost).");
        return;
      }

      // Determine classification according to COA rules (₱50,000 threshold)
      const category = cost >= 50000 ? "Capitalized Asset" : "Semi-Expendable Asset";

      let fileData = null;
      let fileName = "";
      let mimeType = "";

      // Process uploaded image if selected
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        fileData = await getBase64(file);
        fileName = file.name;
        mimeType = file.type;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Uploading...`;

      const payload = {
        assetName: name,
        acquisitionCost: cost,
        category: category,
        propertyNo: propNo,
        accountableOfficer: officer,
        fileData: fileData,
        fileName: fileName,
        mimeType: mimeType
      };

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(response => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane me-1"></i> Submit Asset`;

        if (response.result === "success") {
          alert("Asset registered successfully!");
          document.getElementById('assetForm').reset();
          fetchData(); // Refresh table data
        } else {
          alert("Error: " + (response.error || "Failed to submit data."));
        }
      })
      .catch(error => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane me-1"></i> Submit Asset`;
        console.error("Submission error:", error);
        alert("An error occurred during submission.");
      });
    }

    // Fetch and Populate Asset Table
    function fetchData() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm me-2"></span>Loading inventory...</td></tr>`;

      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">No asset records found.</td></tr>`;
            return;
          }

          tbody.innerHTML = "";
          data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${item.date || ''}</td>
              <td><strong>${item.assetName || ''}</strong><br><small class="text-muted">Prop #${item.propertyNo || 'N/A'}</small></td>
              <td>₱${parseFloat(item.acquisitionCost || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
              <td><span class="badge ${item.category === 'Capitalized Asset' ? 'bg-primary' : 'bg-info'}">${item.category || 'N/A'}</span></td>
              <td>${item.photoUrl ? `<a href="${item.photoUrl}" target="_blank" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-image"></i> View</a>` : '<span class="text-muted">No image</span>'}</td>
              <td><button onclick="printSticker('${item.assetName}', '${item.propertyNo}')" class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-print"></i> Sticker</button></td>
            `;
            tbody.appendChild(tr);
          });
        })
        .catch(err => {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Error loading data from Google Sheets.</td></tr>`;
          console.error("Fetch error:", err);
        });
    }
  </script>
</body>
</html>
