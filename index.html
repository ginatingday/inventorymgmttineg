<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Inventory System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

  <!-- TOP HEADER -->
  <header class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-700 pb-4 mb-6 gap-4 no-print">
    <div>
      <h1 class="text-2xl font-bold text-white tracking-wide">ASSET INVENTORY SYSTEM</h1>
      <p class="text-xs text-slate-400">Local Government Unit Inventory Management</p>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="fetchAssetData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 text-xs px-3 py-2 rounded transition font-medium">🔄 Refresh</button>
      <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded transition font-medium">🖨️ Print Report</button>
    </div>
  </header>

  <!-- MAIN TABLE CONTAINER -->
  <main class="bg-slate-800 border border-slate-700 rounded-lg overflow-hidden shadow-lg">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs border-collapse">
        <thead>
          <tr class="bg-slate-950 text-slate-300 border-b border-slate-700 uppercase tracking-wider font-semibold">
            <th class="p-3">Property No.</th>
            <th class="p-3">Serial No.</th>
            <th class="p-3">Acquisition Date</th>
            <th class="p-3">Asset Description</th>
            <th class="p-3">Accountable</th>
            <th class="p-3">Category</th>
            <th class="p-3">Office</th>
            <th class="p-3">Fund</th>
            <th class="p-3 text-right">Cost (PHP)</th>
            <th class="p-3 text-right">Book Value</th>
            <th class="p-3 text-center">Status</th>
            <th class="p-3 text-center no-print">Photo</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody" class="divide-y divide-slate-700 text-slate-200">
          <tr>
            <td colspan="12" class="p-6 text-center text-slate-400">Loading inventory records...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- UPLOAD PHOTO MODAL -->
  <div id="uploadPhotoModal" class="fixed inset-0 bg-black/75 hidden items-center justify-center p-4 z-50 no-print">
    <div class="bg-slate-800 border border-slate-600 rounded-lg w-full max-w-sm p-5 shadow-2xl">
      <h3 class="text-white font-bold text-sm mb-1">📷 Upload Asset Photo</h3>
      <p id="upload-asset-prop" class="text-amber-400 font-mono text-xs mb-4"></p>
      
      <input type="file" id="photoFileInput" accept="image/*" class="w-full text-xs text-slate-300 bg-slate-900 border border-slate-700 p-2 rounded mb-4 focus:outline-none">
      
      <div class="flex justify-end gap-2">
        <button onclick="closePhotoModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded text-xs transition">Cancel</button>
        <button id="uploadPhotoBtn" onclick="submitPhotoUpload()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-3 py-1.5 rounded text-xs transition">Upload</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Paste your Google Apps Script Web App Deployment URL here
    const API_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"; 
    let selectedPhotoPropertyNo = null;

    document.addEventListener("DOMContentLoaded", () => {
      fetchAssetData();
    });

    async function fetchAssetData() {
      const tbody = document.getElementById("inventoryTableBody");
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        renderTable(data);
      } catch (error) {
        console.error("Error fetching data:", error);
        tbody.innerHTML = `<tr><td colspan="12" class="p-6 text-center text-rose-400">Failed to load data from Google Sheet. Verify API_URL deployment settings.</td></tr>`;
      }
    }

    function renderTable(items) {
      const tbody = document.getElementById("inventoryTableBody");
      if (!items || items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="12" class="p-6 text-center text-slate-400">No asset records found.</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map(item => {
        const propNo = item["Property No."] || "N/A";
        const photoUrl = item["Photos"] || "";

        const photoCell = photoUrl 
          ? `<a href="${photoUrl}" target="_blank"><img src="${photoUrl}" class="w-8 h-8 object-cover rounded border border-slate-600 mx-auto hover:opacity-80 transition" /></a>`
          : `<button onclick="openPhotoModal('${propNo}')" class="bg-slate-700 hover:bg-slate-600 text-emerald-400 border border-slate-600 px-2 py-1 rounded text-[10px] font-medium mx-auto block">📷 + Photo</button>`;

        return `
          <tr class="hover:bg-slate-750 transition">
            <td class="p-3 font-mono font-semibold text-white">${propNo}</td>
            <td class="p-3">${item["Serial No."] || "-"}</td>
            <td class="p-3">${item["Acquisition Date"] || "-"}</td>
            <td class="p-3 text-white">${item["Asset Description"] || "-"}</td>
            <td class="p-3">${item["Accountable"] || "-"}</td>
            <td class="p-3">${item["Category"] || "-"}</td>
            <td class="p-3">${item["Office"] || "-"}</td>
            <td class="p-3">${item["Fund"] || "-"}</td>
            <td class="p-3 text-right font-mono">${item["Cost (PHP)"] ? Number(item["Cost (PHP)"]).toLocaleString('en-US', {minimumFractionDigits: 2}) : "0.00"}</td>
            <td class="p-3 text-right font-mono">${item["Book Value (PHP)"] ? Number(item["Book Value (PHP)"]).toLocaleString('en-US', {minimumFractionDigits: 2}) : "0.00"}</td>
            <td class="p-3 text-center">
              <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-900/50 text-emerald-300 border border-emerald-700">
                ${item["Status"] || "Active"}
              </span>
            </td>
            <td class="p-3 text-center no-print">${photoCell}</td>
          </tr>
        `;
      }).join("");
    }

    function openPhotoModal(propNo) {
      selectedPhotoPropertyNo = propNo;
      document.getElementById('upload-asset-prop').innerText = `Property No: ${propNo}`;
      document.getElementById('uploadPhotoModal').classList.remove('hidden');
      document.getElementById('uploadPhotoModal').classList.add('flex');
    }

    function closePhotoModal() {
      selectedPhotoPropertyNo = null;
      document.getElementById('photoFileInput').value = '';
      document.getElementById('uploadPhotoModal').classList.add('hidden');
      document.getElementById('uploadPhotoModal').classList.remove('flex');
    }

    async function submitPhotoUpload() {
      const fileInput = document.getElementById('photoFileInput');
      if (!fileInput.files.length) {
        alert("Please select an image file.");
        return;
      }

      const btn = document.getElementById('uploadPhotoBtn');
      btn.innerText = "Uploading...";
      btn.disabled = true;

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async function(e) {
        const payload = {
          action: "uploadPhoto",
          propertyNo: selectedPhotoPropertyNo,
          fileName: file.name,
          fileData: e.target.result
        };

        try {
          await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          
          alert("Photo submitted! Allow a few seconds for Google Drive to update, then click Refresh.");
          closePhotoModal();
          setTimeout(fetchAssetData, 2500);
        } catch (err) {
          console.error("Upload error:", err);
          alert("Failed to upload photo.");
        } fontally {
          btn.innerText = "Upload";
          btn.disabled = false;
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
