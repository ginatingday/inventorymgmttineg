<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Inventory System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#060911] text-slate-100 min-h-screen p-4 font-sans">

  <!-- TOP HEADER -->
  <header class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-4 mb-6 gap-4">
    <div>
      <h1 class="text-xl font-bold text-emerald-400">INVENTORY MANAGEMENT SYSTEM</h1>
      <p class="text-xs text-slate-400">Asset Tracking & Photo Synchronization</p>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="fetchAssetData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs px-3 py-2 rounded transition">🔄 Refresh Data</button>
    </div>
  </header>

  <!-- MAIN TABLE CONTAINER -->
  <main class="bg-[#0b0f19] border border-slate-800 rounded-lg overflow-hidden shadow-xl">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs border-collapse">
        <thead>
          <tr class="bg-[#0e1424] text-slate-400 border-b border-slate-800 uppercase tracking-wider text-[11px]">
            <th class="p-3">Property No.</th>
            <th class="p-3">Serial No.</th>
            <th class="p-3">Acquisition Date</th>
            <th class="p-3">Asset Description</th>
            <th class="p-3">Accountable</th>
            <th class="p-3">Category</th>
            <th class="p-3">Office</th>
            <th class="p-3">Fund</th>
            <th class="p-3">Cost (PHP)</th>
            <th class="p-3">Book Value</th>
            <th class="p-3">Status</th>
            <th class="p-3 text-center">Photo</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody" class="divide-y divide-slate-800 text-slate-300">
          <tr>
            <td colspan="12" class="p-4 text-center text-slate-500">Loading inventory records...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- UPLOAD PHOTO MODAL -->
  <div id="uploadPhotoModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50 no-print">
    <div class="bg-[#0b0f19] border border-slate-800 rounded-lg w-full max-w-sm p-5 shadow-2xl">
      <h3 class="text-emerald-400 font-bold text-sm mb-1">📷 UPLOAD ASSET PHOTO</h3>
      <p id="upload-asset-prop" class="text-amber-400 font-mono text-xs mb-4"></p>
      
      <input type="file" id="photoFileInput" accept="image/*" class="w-full text-xs text-slate-300 bg-[#060911] border border-slate-800 p-2 rounded mb-4 focus:outline-none focus:border-emerald-500">
      
      <div class="flex justify-end gap-2">
        <button onclick="closePhotoModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded text-xs transition">Cancel</button>
        <button id="uploadPhotoBtn" onclick="submitPhotoUpload()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-3 py-1.5 rounded text-xs transition">Upload to Sheet</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Replace with your Google Apps Script Web App Deployment URL
    const API_URL = "https://script.google.com/macros/s/AKfycbyTnvMRzK_-0Xv_n0gJM1KoNT70tmYEGONSl7INsYfMlyMlldJUN0eWAtW5K0kplA3ylw/exec"; 
    let selectedPhotoPropertyNo = null;

    document.addEventListener("DOMContentLoaded", () => {
      fetchAssetData();
    });

    // Fetch data from Google Sheet
    async function fetchAssetData() {
      const tbody = document.getElementById("inventoryTableBody");
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        renderTable(data);
      } catch (error) {
        console.error("Error fetching data:", error);
        tbody.innerHTML = `<tr><td colspan="12" class="p-4 text-center text-rose-400">Failed to load data from Google Sheet. Check API_URL.</td></tr>`;
      }
    }

    // Render table rows dynamically
    function renderTable(items) {
      const tbody = document.getElementById("inventoryTableBody");
      if (!items || items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="12" class="p-4 text-center text-slate-500">No asset records found.</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map(item => {
        const propNo = item["Property No."] || "N/A";
        const photoUrl = item["Photos"] || "";

        const photoCell = photoUrl 
          ? `<a href="${photoUrl}" target="_blank"><img src="${photoUrl}" class="w-8 h-8 object-cover rounded border border-slate-700 mx-auto hover:scale-110 transition" /></a>`
          : `<button onclick="openPhotoModal('${propNo}')" class="bg-slate-900 hover:bg-slate-800 text-emerald-400 border border-slate-800 px-2 py-1 rounded text-[10px] font-medium mx-auto block">📷 + Photo</button>`;

        return `
          <tr class="hover:bg-[#0e1424] transition">
            <td class="p-3 font-mono font-bold text-slate-200">${propNo}</td>
            <td class="p-3">${item["Serial No."] || "-"}</td>
            <td class="p-3">${item["Acquisition Date"] || "-"}</td>
            <td class="p-3 text-slate-100">${item["Asset Description"] || "-"}</td>
            <td class="p-3">${item["Accountable"] || "-"}</td>
            <td class="p-3">${item["Category"] || "-"}</td>
            <td class="p-3">${item["Office"] || "-"}</td>
            <td class="p-3">${item["Fund"] || "-"}</td>
            <td class="p-3 font-mono">${item["Cost (PHP)"] || "0.00"}</td>
            <td class="p-3 font-mono">${item["Book Value (PHP)"] || "0.00"}</td>
            <td class="p-3">
              <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800">
                ${item["Status"] || "Active"}
              </span>
            </td>
            <td class="p-3 text-center">${photoCell}</td>
          </tr>
        `;
      }).join("");
    }

    // Modal controls
    function openPhotoModal(propNo) {
      selectedPhotoPropertyNo = propNo;
      document.getElementById('upload-asset-prop').innerText = `Property No: ${propNo}`;
      document.getElementById('uploadPhotoModal').classList.remove('hidden');
      document.getElementById('uploadPhotoModal').classList.add('flex');
    }

    function closePhotoModal() {
      selectedPhotoPropertyNo = null;
      document.getElementById('photoFileInput').value = '';
      document.getElementById('uploadPhotoModal').classList.add('hidden');
      document.getElementById('uploadPhotoModal').classList.remove('flex');
    }

    // Submit base64 encoded photo to Google Apps Script
    async function submitPhotoUpload() {
      const fileInput = document.getElementById('photoFileInput');
      if (!fileInput.files.length) {
        alert("Please select an image file.");
        return;
      }

      const btn = document.getElementById('uploadPhotoBtn');
      btn.innerText = "Uploading...";
      btn.disabled = true;

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async function(e) {
        const payload = {
          action: "uploadPhoto",
          propertyNo: selectedPhotoPropertyNo,
          fileName: file.name,
          fileData: e.target.result
        };

        try {
          await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          
          alert("Photo upload submitted! Please refresh in a moment to view the updated image.");
          closePhotoModal();
          setTimeout(fetchAssetData, 2000); // Trigger auto-refresh after 2 seconds
        } catch (err) {
          console.error("Upload error:", err);
          alert("Failed to upload photo.");
        } finally {
          btn.innerText = "Upload to Sheet";
          btn.disabled = false;
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
