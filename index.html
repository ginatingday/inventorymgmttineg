<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">

  <div class="max-w-[95%] mx-auto space-y-6">
    <!-- Header -->
    <div class="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
      <div>
        <h1 class="text-xl font-bold text-slate-100">📋 General Ledger & Asset Registry</h1>
        <p class="text-xs text-slate-400">Track and update property, plant, and equipment assets.</p>
      </div>
      <button onclick="openAddModal()" class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm shadow transition">
        ➕ Add New Asset
      </button>
    </div>

    <!-- Table Container -->
    <div class="overflow-x-auto bg-slate-900 border border-slate-800 rounded-xl shadow-lg">
      <table class="w-full text-xs text-left text-slate-300">
        <thead class="bg-slate-800/80 uppercase text-[11px] text-slate-400 font-semibold border-b border-slate-700">
          <tr>
            <th class="py-3 px-2 text-center">Photo</th>
            <th class="py-3 px-2">Prop No.</th>
            <th class="py-3 px-2">Serial No.</th>
            <th class="py-3 px-2">Acq Date</th>
            <th class="py-3 px-3">Description</th>
            <th class="py-3 px-2">Accountable</th>
            <th class="py-3 px-2">Category</th>
            <th class="py-3 px-2">Office</th>
            <th class="py-3 px-2">Fund</th>
            <th class="py-3 px-2 text-right">Cost</th>
            <th class="py-3 px-2 text-right">Salvage</th>
            <th class="py-3 px-2 text-center">Life (Yrs)</th>
            <th class="py-3 px-2 text-right">Book Value</th>
            <th class="py-3 px-2 text-center">Status</th>
            <th class="py-3 px-3 text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="asset-table-body">
          <!-- Rows dynamically rendered via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Unified Add / Edit Asset Modal -->
  <div id="addModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-3xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      
      <!-- Modal Header -->
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 id="modalTitle" class="text-lg font-bold text-amber-400">➕ ADD NEW ASSET</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-100 font-bold text-lg">✕</button>
      </div>

      <!-- Asset Form -->
      <form id="addAssetForm" onsubmit="submitAssetForm(event)" class="space-y-4">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Property No.*</label>
            <input type="text" id="add-prop" required class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Serial No.</label>
            <input type="text" id="add-serial" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Acquisition Date</label>
            <input type="date" id="add-date" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Description*</label>
            <input type="text" id="add-desc" required class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Accountable Officer</label>
            <input type="text" id="add-accountable" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Category</label>
            <input type="text" id="add-category" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Office / Station</label>
            <input type="text" id="add-office" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Fund Source</label>
            <input type="text" id="add-fund" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Cost (₱)</label>
            <input type="number" step="0.01" id="add-cost" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Salvage Value (₱)</label>
            <input type="number" step="0.01" id="add-salvage" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Useful Life (Yrs)</label>
            <input type="number" id="add-life" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Book Value (₱)</label>
            <input type="number" step="0.01" id="add-bookvalue" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Status</label>
            <select id="add-status" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
              <option value="Serviceable">Serviceable</option>
              <option value="Unserviceable">Unserviceable</option>
              <option value="In Repair">In Repair</option>
              <option value="Disposed">Disposed</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Asset Photo</label>
            <input type="file" id="add-photo-file" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-400 mb-1">Remarks</label>
          <textarea id="add-remarks" rows="2" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500"></textarea>
        </div>

        <!-- Submit Actions -->
        <div class="flex justify-end space-x-2 pt-3 border-t border-slate-800">
          <button type="button" onclick="closeAddModal()" class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-semibold">
            Cancel
          </button>
          <button type="submit" id="submitBtn" class="px-4 py-1.5 bg-amber-600 hover:bg-amber-500 text-slate-950 rounded text-xs font-bold">
            💾 Save to Sheet
          </button>
        </div>

      </form>
    </div>
  </div>

  <script>
    let activeEditPropNo = null;

    // Sample Asset Data (Replace with response from Google Apps Script)
    let sampleAssets = [
      {
        photoUrl: "",
        propNo: "PROP-2026-001",
        serialNo: "SN-998823",
        acquisitionDate: "2026-01-15",
        description: "Dell Latitude Laptop",
        accountable: "John Doe",
        category: "IT Equipment",
        office: "Accounting",
        fund: "General Fund",
        cost: 45000,
        salvage: 4500,
        usefulLife: 5,
        bookValue: 36000,
        status: "Serviceable",
        remarks: "Good condition"
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      fetchAssetData();
    });

    function fetchAssetData() {
      // In production, call your Apps Script backend:
      // google.script.run.withSuccessHandler(renderTableRows).getAssetData();
      renderTableRows(sampleAssets);
    }

    function renderTableRows(assets) {
      const tableBody = document.getElementById("asset-table-body");
      tableBody.innerHTML = "";

      assets.forEach((item) => {
        const row = document.createElement("tr");
        row.className = "border-b border-slate-800/50 hover:bg-slate-900/40";

        row.innerHTML = `
          <td class="py-2 px-2 text-center">
            ${item.photoUrl ? `<img src="${item.photoUrl}" class="w-8 h-8 rounded object-cover mx-auto">` : '🖼️'}
          </td>
          <td class="py-2 px-2 text-amber-400 font-bold">${item.propNo}</td>
          <td class="py-2 px-2">${item.serialNo || 'N/A'}</td>
          <td class="py-2 px-2">${item.acquisitionDate || 'N/A'}</td>
          <td class="py-2 px-3 font-semibold text-slate-200">${item.description}</td>
          <td class="py-2 px-2">${item.accountable || 'N/A'}</td>
          <td class="py-2 px-2">${item.category}</td>
          <td class="py-2 px-2">${item.office}</td>
          <td class="py-2 px-2">${item.fund}</td>
          <td class="py-2 px-2 text-right">₱${Number(item.cost).toLocaleString()}</td>
          <td class="py-2 px-2 text-right">₱${Number(item.salvage).toLocaleString()}</td>
          <td class="py-2 px-2 text-center">${item.usefulLife}</td>
          <td class="py-2 px-2 text-right text-cyan-400 font-bold">₱${Number(item.bookValue).toLocaleString()}</td>
          <td class="py-2 px-2 text-center">${item.status}</td>
          <td class="py-2 px-3 text-center space-x-1">
            <button onclick='openEditModal(${JSON.stringify(item)})' class="bg-amber-950/80 hover:bg-amber-900 text-amber-300 border border-amber-700/60 px-2 py-1 rounded text-[10px] font-semibold">
              ✏️ Edit
            </button>
            <button onclick="openStickerModal('${item.propNo}')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2 py-1 rounded text-[10px]">
              🏷️ Sticker
            </button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function openAddModal() {
      activeEditPropNo = null;
      document.getElementById("addAssetForm").reset();
      document.getElementById("modalTitle").innerText = "➕ ADD NEW ASSET";
      document.getElementById("submitBtn").innerText = "💾 Save to Sheet";
      document.getElementById("add-prop").disabled = false;
      
      document.getElementById("addModal").classList.remove("hidden");
      document.getElementById("addModal").classList.add("flex");
    }

    function openEditModal(asset) {
      activeEditPropNo = asset.propNo;

      document.getElementById("modalTitle").innerText = "✏️ EDIT ASSET";
      document.getElementById("submitBtn").innerText = "💾 Update Asset";

      document.getElementById("add-prop").value = asset.propNo;
      document.getElementById("add-prop").disabled = true; // Lock Property No. on Edit
      document.getElementById("add-serial").value = asset.serialNo || "";
      document.getElementById("add-date").value = asset.acquisitionDate || "";
      document.getElementById("add-desc").value = asset.description || "";
      document.getElementById("add-accountable").value = asset.accountable || "";
      document.getElementById("add-category").value = asset.category || "";
      document.getElementById("add-office").value = asset.office || "";
      document.getElementById("add-fund").value = asset.fund || "";
      document.getElementById("add-cost").value = asset.cost || "";
      document.getElementById("add-salvage").value = asset.salvage || "";
      document.getElementById("add-life").value = asset.usefulLife || "";
      document.getElementById("add-bookvalue").value = asset.bookValue || "";
      document.getElementById("add-status").value = asset.status || "Serviceable";
      document.getElementById("add-remarks").value = asset.remarks || "";

      document.getElementById("addModal").classList.remove("hidden");
      document.getElementById("addModal").classList.add("flex");
    }

    function closeAddModal() {
      activeEditPropNo = null;
      document.getElementById("addAssetForm").reset();
      document.getElementById("add-prop").disabled = false;
      document.getElementById("addModal").classList.add("hidden");
      document.getElementById("addModal").classList.remove("flex");
    }

    function submitAssetForm(event) {
      event.preventDefault();

      const fileInput = document.getElementById("add-photo-file");
      const file = fileInput.files[0];

      const payload = {
        propNo: document.getElementById("add-prop").value,
        serialNo: document.getElementById("add-serial").value,
        acquisitionDate: document.getElementById("add-date").value,
        description: document.getElementById("add-desc").value,
        accountable: document.getElementById("add-accountable").value,
        category: document.getElementById("add-category").value,
        office: document.getElementById("add-office").value,
        fund: document.getElementById("add-fund").value,
        cost: document.getElementById("add-cost").value,
        salvage: document.getElementById("add-salvage").value,
        usefulLife: document.getElementById("add-life").value,
        bookValue: document.getElementById("add-bookvalue").value,
        status: document.getElementById("add-status").value,
        remarks: document.getElementById("add-remarks").value,
        isUpdate: activeEditPropNo !== null
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          payload.imageBytes = e.target.result.split(',')[1];
          payload.mimeType = file.type;
          payload.fileName = file.name;
          sendToBackend(payload);
        };
        reader.readAsDataURL(file);
      } else {
        sendToBackend(payload);
      }
    }

    function sendToBackend(payload) {
      if (typeof google !== "undefined" && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(() => {
            closeAddModal();
            fetchAssetData();
          })
          .saveOrUpdateAsset(payload);
      } else {
        // Fallback for offline testing
        console.log("Submitted Payload:", payload);
        closeAddModal();
      }
    }

    function openStickerModal(propNo) {
      alert("Opening sticker preview for: " + propNo);
    }
  </script>
</body>
</html>
